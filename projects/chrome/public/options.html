<!DOCTYPE html>

<html>
  <head>
    <title>Plebeian Signer - Options</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <script src="scripts.js"></script>
    <style>
      /* Prevent white flash on load */
      html { background-color: #0a0a0a; }
      @media (prefers-color-scheme: light) {
        html { background-color: #ffffff; }
      }

      body {
        background: var(--background);
        height: 100vh;
        width: 100vw;
        color: var(--foreground);
        font-size: 16px;
        box-sizing: border-box;
      }

      .page {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-y: auto;
      }

      .container {
        max-width: 1200px;
        box-sizing: border-box;
        width: 100%;
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .logo {
        height: 60px;
        width: 60px;
        border-radius: 100%;
        border: 2px solid var(--secondary);

        img {
          height: 100%;
          width: 100%;
        }
      }

      .brand-name {
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: 4px;
        color: var(--secondary);
      }

      .main-header {
        padding-top: 50px;
        font-size: 50px;
        font-weight: 500;
      }

      .sub-header {
        padding-top: 28px;
        font-size: 20px;
        max-width: 460px;
        text-align: right;
        line-height: 1.4;

        .accent {
          color: var(--secondary);
          border: 1px solid var(--secondary);
          border-radius: 4px;
          padding: 2px 4px;
        }
      }

      .middle {
        margin-top: 68px;
        width: 100%;
        background: var(--background-light);
        display: flex;
        flex-direction: row;
        justify-content: center;
        padding-bottom: 24px;
      }

      .option-label {
        font-size: 20px;
        margin-bottom: 0px;
        margin-top: 16px;
      }

      .option-text {
        color: gray;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="container sam-flex-row gap" style="margin-top: 16px">
        <div class="logo">
          <img src="logo.svg" alt="" />
        </div>
        <span class="brand-name">Plebeian Signer</span>
        <span>OPTIONS</span>
      </div>

      <div class="container sam-flex-column center">
        <span class="main-header"> Nostr Identity Manager & Signer </span>
        <span class="sub-header">
          Manage and switch between
          <span class="accent">multiple identities</span>
          while interacting with Nostr apps
        </span>
      </div>

      <div class="middle">
        <div class="container sam-flex-column">
          <span class="option-label">Vault Management</span>
          <span class="option-text">
            Use the extension popup to import and export vault data.
            Vault import and export are available in Settings.
          </span>
        </div>
      </div>
    </div>
  </body>
</html>
